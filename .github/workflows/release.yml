# Layer 3 on a tag: build the figures and tables from the published bundles in
# output/bundles/ and attach figures.pdf to a GitHub release.
#
#   1. bump `version` in pyproject.toml (and the mlye entry in uv.lock)
#   2. git tag v<version> && git push origin v<version>
#
# Layer 3 needs only numpy, so the job installs that single pin from
# requirements.lock rather than the full (torch/CUDA) environment. Tectonic
# comes from mise.toml; Ghostscript (for the EPS files) from apt.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:     # dry run: builds figures.pdf as a workflow artifact, no release

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install numpy (pinned in requirements.lock)
        run: grep '^numpy==' requirements.lock | pip install -r /dev/stdin

      - uses: jdx/mise-action@v3   # tectonic (and uv) as pinned in mise.toml

      - name: Install Ghostscript
        run: sudo apt-get update && sudo apt-get install -y ghostscript

      - name: Layer 3
        run: python replicate.py run --layer 3 --force

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: output/logs/

      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: output/figures/figures.pdf

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" output/figures/figures.pdf \
            --title "${GITHUB_REF_NAME}" \
            --notes "Figures and tables built by layer 3 (\`python replicate.py run --layer 3 --force\`) from the bundles in output/bundles/ at ${GITHUB_SHA}."
